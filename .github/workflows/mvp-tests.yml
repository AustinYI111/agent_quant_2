name: A-share MVP tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-operations.txt
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements-operations.txt
          python -m pip install --no-deps -e .
      - name: Point-in-time MVP tests
        run: python -m pytest -q
      - name: Legacy offline regression
        env:
          PYTHONPATH: agent_quant-main/multi_agent_quant
        run: python -m pytest -q agent_quant-main/multi_agent_quant/tests --ignore=agent_quant-main/multi_agent_quant/tests/test_data_agent.py

      - name: Offline end-to-end release check
        run: python -m ashare_mvp.release_check --out artifacts/release_check

  development-pr:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/quant-mvp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = 'feature/quant-mvp';
            const existing = await github.rest.pulls.list({owner, repo, head: `${owner}:${head}`, state: 'open'});
            const body = 'Personal Quant Research MVP: causal factor ranking, public-data validation, persisted model contracts, encrypted backups and Windows migration.\n\nValidation: MVP tests, legacy offline regression and synthetic end-to-end release check passed for this commit. Synthetic validation does not establish real profitability; full-market data reconciliation and formal model approval remain pending.\n\nMain merge requires owner confirmation. No automatic merge.';
            if (existing.data.length) {
              await github.rest.pulls.update({owner, repo, pull_number: existing.data[0].number, title: 'Personal Quant Research MVP and portable model management', body});
            } else {
              await github.rest.pulls.create({owner, repo, head, base: 'main', draft: true, title: 'Personal Quant Research MVP and portable model management', body});
            }
